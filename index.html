<meta name="apple-mobile-web-app-capable" content="yes">

 html,body{margin:0;padding:0;background:#FFFFFF;}
 body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

<body>
<div id="app">
<style>
#app{
 --pap:#EFF1FC;--card:#FFFFFF;--ink:#16132B;--soft:#7B79A4;--line:#DDDEF2;--card2:#FFFFFF;
 --a1:#00A98D;--a2:#E01B6E;--a3:#6C3BF5;--a4:#E8A302;--bad:#E01B6E;
 font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background:linear-gradient(180deg,#F2E7D5 0%,#0E1014 40%,#10131A 100%);color:var(--ink);display:block;max-width:560px;margin:0 auto;
 padding:14px 16px 82px;font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased;
 -webkit-user-select:none;user-select:none;touch-action:manipulation;}
#app *{box-sizing:border-box;}
#app button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
#app input,#app select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;}
#app .num{font-variant-numeric:tabular-nums;}
#app .lab{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);}
#app .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
#app .sec{margin-bottom:26px;}
#app hr{border:none;border-top:1px solid var(--line);margin:18px 0;}

/* entete */
#app .head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;}
#app .head .sc{font-size:52px;font-weight:300;letter-spacing:-.05em;line-height:.9;}
#app .head .sc s{font-size:14px;text-decoration:none;color:var(--soft);}
#app .head .rt{text-align:right;}

/* jauges */
#app .gz{display:flex;gap:22px;justify-content:space-between;}
#app .g{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
#app .tb{width:15px;height:86px;border-radius:2px;background:#E7E9F8;position:relative;overflow:hidden;}
#app .tb i{position:absolute;left:0;right:0;bottom:0;transition:height .25s ease;}
#app .tb.dr{width:16px;}
#app .g .v{font-size:13px;font-weight:600;}
#app .g .n{font-size:10px;color:var(--soft);}
#app .steps{display:flex;gap:8px;justify-content:center;margin-top:12px;}
#app .st{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--soft);}

/* repas */
#app .h2{font-size:15px;font-weight:650;margin-bottom:12px;}
#app .mrow{display:flex;gap:6px;}
#app .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0;}
#app .m .ic{width:100%;aspect-ratio:1;max-width:46px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);
 display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;}
#app .m.on .ic{border-color:var(--a1);background:#E2F7F2;}
#app .m.on .ic:after{content:"✓";position:absolute;right:-3px;top:-3px;width:15px;height:15px;border-radius:99px;background:var(--a1);color:#F2E7D5;font-size:9px;display:flex;align-items:center;justify-content:center;}
#app .m.sel .ic{border-color:var(--ink);border-width:2px;}
#app .m .h{font-size:9.5px;color:var(--soft);}
#app .mtitle{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 10px;}
#app .mtitle b{font-size:15px;font-weight:650;}
#app .mtitle span{font-size:11.5px;color:var(--soft);}
#app .fg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
#app .f{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 3px 7px;text-align:center;position:relative;}
#app .f .ee{font-size:21px;line-height:1.1;}
#app .f .nn{font-size:9.5px;margin-top:3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#app .f .kk{font-size:8.5px;color:var(--soft);}
#app .f.has{border-color:var(--a1);background:#E2F7F2;}
#app .f i{position:absolute;top:3px;right:3px;background:var(--a1);color:#F2E7D5;border-radius:99px;font-style:normal;font-size:10px;font-weight:700;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;}
#app .f .mo{position:absolute;top:3px;left:3px;background:var(--pap);color:var(--a2);border:1px solid var(--a2);border-radius:99px;font-size:9px;font-weight:700;width:19px;height:19px;display:flex;align-items:center;justify-content:center;}
#app .acts{display:flex;gap:8px;margin-top:12px;}
#app .acts button{flex:1;border:1px solid var(--line);border-radius:7px;padding:12px 0;font-size:13px;font-weight:600;background:var(--card);}
#app .acts .val{background:var(--a1);border-color:var(--a1);color:#F2E7D5;}
#app .ln{font-size:12px;color:var(--soft);margin-top:10px;}
#app .duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;}

/* muscu */
#app .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
#app .gc{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 4px 8px;text-align:center;}
#app .gc.on{border-color:currentColor;}
#app .gc .nn{font-size:12px;font-weight:650;margin-top:4px;color:var(--ink);}
#app .ex{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:12px;margin-bottom:9px;display:flex;align-items:center;gap:12px;}
#app .ex.sel{border-color:var(--ink);}
#app .exi{flex:0 0 auto;}
#app .exn{flex:1;text-align:left;}
#app .exn{font-size:13.5px;font-weight:650;flex:1;text-align:left;}
#app .exn span{font-size:11px;color:var(--soft);}
#app .stepper{display:flex;align-items:center;gap:4px;flex:0 0 auto;}
#app .stepper button{width:26px;height:26px;border-radius:99px;border:1px solid var(--line);font-size:14px;color:var(--soft);display:flex;align-items:center;justify-content:center;}
#app .stepper .w{font-size:15px;font-weight:650;min-width:38px;text-align:center;}
#app .big{width:44px;height:44px;border-radius:99px;background:var(--a1);color:#F2E7D5;font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
#app .det{background:var(--card);border:1px solid var(--ink);border-top:none;border-radius:0 0 14px 14px;margin:-13px 0 9px;padding:10px 12px 12px;}
#app .pad{display:flex;gap:6px;flex-wrap:wrap;}
#app .pad button{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11.5px;color:var(--soft);background:var(--card);}
#app .mini2{margin-top:18px;display:flex;flex-direction:column;gap:8px;}
#app .lig{display:flex;align-items:center;gap:8px;}
#app .lig .emo{font-size:17px;}
#app .lig .vv{font-size:15px;font-weight:700;min-width:54px;}
#app .lig .vv s{font-size:10px;color:var(--soft);text-decoration:none;font-weight:400;}
#app .lig .track{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden;}
#app .lig .track i{display:block;height:100%;border-radius:99px;transition:width .2s;}
#app .bo{height:40px;min-width:46px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 1px 0 rgba(22,19,43,.14);}
#app .bo.pl2{background:var(--a1);border-color:var(--a1);color:#F2E7D5;}
#app .bo.mo2{border-color:var(--a1);color:var(--a1);min-width:42px;padding:0;}
#app .bo.pl3{background:#6C3BF5;border-color:#6C3BF5;color:#F2E7D5;}
#app .bo.mo3{border-color:#6C3BF5;color:#5B2FD6;min-width:42px;padding:0;}
#app .duo2{display:none;}
#app .kart{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:11px;}
#app .krow{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
#app .bigv{font-size:17px;font-weight:700;}
#app .bigv s{font-size:10px;color:var(--soft);text-decoration:none;font-weight:400;}
#app .krow2{display:flex;gap:5px;margin-top:9px;}
#app .krow2 button{flex:1;border:1px solid var(--line);border-radius:7px;padding:9px 0;font-size:11.5px;font-weight:600;color:var(--ink);background:var(--pap);}
#app .hours{display:flex;gap:3px;margin-top:10px;height:34px;align-items:flex-end;}
#app .hr{flex:1;height:60%;border-radius:4px;background:var(--line);border:none;}
#app .hr.on{background:#6C3BF5;height:100%;}
#app .hr.half{background:#C3B4FA;height:80%;}
#app .chr{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:70;display:flex;align-items:center;gap:10px;background:var(--a1);color:#F2E7D5;border-radius:999px;padding:9px 10px 9px 16px;box-shadow:0 6px 18px rgba(0,169,141,.28);}
#app .chr .tt{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;}
#app .chr button{background:rgba(255,255,255,.18);color:#F2E7D5;border-radius:999px;width:32px;height:32px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;}
#app .chr.fin{background:var(--a2);box-shadow:0 6px 18px rgba(224,96,76,.28);}
#app .kpi{display:flex;gap:8px;margin-bottom:14px;}
#app .kpi div{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 10px;}
#app .kpi b{display:block;font-size:17px;font-weight:700;}
#app .kpi span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);}
#app .hist{margin-top:20px;}
#app .chrbtn{border:1.5px solid var(--a1);color:var(--a1);background:var(--card);border-radius:8px;height:42px;padding:0 14px;font-size:13.5px;font-weight:700;box-shadow:0 1px 0 rgba(22,19,43,.14);}
#app .calhd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
#app .calhd b{font-size:14px;font-weight:700;text-transform:capitalize;}
#app .cal{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;align-items:center;}
#app .mois{flex:0 0 auto;writing-mode:horizontal-tb;font-size:10px;font-weight:700;color:var(--a2);text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:0 4px;border-left:1px solid var(--line);height:62px;display:flex;flex-direction:column;justify-content:center;}
#app .mois span{font-weight:400;color:var(--soft);font-size:9px;}
#app .cd{flex:0 0 42px;height:62px;border:1px solid var(--line);border-radius:8px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
#app .cd .j1{font-size:9.5px;color:var(--soft);letter-spacing:.06em;}
#app .cd .j2{font-size:15px;font-weight:700;}
#app .cd .gp2{display:flex;gap:2px;height:7px;}
#app .cd .gp2 i{width:6px;height:6px;border-radius:99px;display:block;}
#app .cd.act{border-color:var(--a1);background:#E2F7F2;}
#app .cd.cur{border-color:var(--ink);border-width:2px;}
#app .cd.auj .j2{text-decoration:underline;}
#app .sdet{margin-top:10px;font-size:12.5px;}
#app .sli{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);}
#app .sli b{font-weight:650;white-space:nowrap;}
#app .add{width:100%;border:1px dashed var(--line);border-radius:7px;padding:13px;font-size:12.5px;color:var(--soft);margin-top:14px;}
/* eau */
#app .eaux{display:none;}
#app .bottles{display:flex;gap:4px;margin-top:10px;}
#app .bl{flex:1;max-width:22px;height:32px;border:1.5px solid var(--line);border-radius:5px 5px 9px 9px;position:relative;overflow:hidden;background:var(--card);}
#app .bl i{position:absolute;left:0;right:0;bottom:0;background:var(--a1);transition:height .2s;}
#app .bl.on{border-color:var(--a1);}
#app .bt2{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;flex:0 0 auto;}
#app .bt2.aq{border-color:var(--a1);color:var(--a1);}
#app .sleeprow{display:flex;gap:8px;align-items:center;margin-top:10px;}
#app .sleeprow .val2{flex:1;font-size:12.5px;color:var(--soft);}
/* paliers */
#app .pl{display:flex;gap:5px;flex:1;}
#app .p1{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 0;text-align:center;background:var(--card);font-size:11px;color:var(--soft);font-weight:600;}
#app .p1 em{font-style:normal;font-size:10px;opacity:.85;}
#app .p1 .dots{display:flex;gap:7px;justify-content:center;margin-top:6px;}
#app .p1 .dd{width:9px;height:9px;border-radius:99px;background:var(--line);}
#app .p1.fait{border-color:var(--a1);background:#E2F7F2;}
#app .p1.fait{color:var(--a1);}
#app .p1.fait .dd{background:var(--a1);}
#app .p1.encours{border-color:var(--ink);}
#app .p1.encours{color:var(--ink);}
#app .p1.encours .dd.on{background:var(--ink);}
#app .wt{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
#app .wt button{width:36px;height:36px;border-radius:99px;border:1.5px solid var(--line);font-size:20px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;background:var(--pap);box-shadow:0 1px 0 rgba(22,19,43,.14);}
#app .wt .w{font-size:17px;font-weight:700;min-width:50px;text-align:center;}
#app .wt .w s{font-size:10px;margin-left:1px;color:var(--soft);text-decoration:none;font-weight:400;}
#app .r1{display:flex;align-items:center;gap:10px;}
#app .r2{display:flex;align-items:center;gap:8px;margin-top:8px;}
#app .exn .fa{color:var(--a1);font-weight:800;margin-left:4px;}
#app .seances{display:flex;gap:5px;flex:0 0 auto;}
#app .seances button{width:50px;height:40px;border-radius:8px;border:1.5px solid var(--line);font-size:20px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;background:var(--pap);box-shadow:0 1px 0 rgba(22,19,43,.14);}
#app .seances .plus{background:var(--a1);border-color:var(--a1);color:#F2E7D5;}
#app .seances{gap:7px;}
#app .seances .sl{flex:1;text-align:center;font-size:12px;color:var(--soft);}
#app .seances .sl b{color:var(--ink);font-size:14px;}
#app .cible2{font-size:11px;color:var(--soft);text-align:center;margin-top:3px;}

#app .nav{grid-template-columns:repeat(3,1fr);position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:rgba(239,241,252,.95);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:10px 6px 20px;backdrop-filter:blur(8px);}
#app .nav button{font-size:13px;color:var(--soft);padding:4px 2px;border-bottom:2px solid transparent;}
#app .nav button.on{color:var(--a1);font-weight:700;letter-spacing:.04em;border-bottom-color:var(--a1);}
#app .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
#app .bx{background:var(--card);border-radius:9px 14px 0 0;width:100%;max-width:560px;padding:20px 18px 26px;max-height:86vh;overflow:auto;}
#app .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
#app .fl{margin-bottom:9px;}
#app .cta{width:100%;padding:12px;border-radius:9px;background:var(--a1);color:#F2E7D5;font-weight:650;margin-top:10px;}
#app .gh{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);color:var(--soft);margin-top:8px;}
#app .dl{color:var(--bad);}
@media (prefers-reduced-motion:reduce){#app *{transition:none!important;}}

/* ================= style ninja ================= */
html,body{background:#EAECFA;margin:0;}
#app{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
 background-color:#EFF1FC;
 background-image:repeating-linear-gradient(0deg,rgba(108,59,245,.05) 0 1px,transparent 1px 5px),
  linear-gradient(180deg,#FFFFFF 0%,#EFF1FC 45%,#E6E9FB 100%);
 min-height:100vh;}
#app .card,#app .exc,#app .gc,#app .f,#app .cd,#app .bo,#app .m .ic,#app .cta,#app .gh,#app .add,
#app .pad button,#app .acts button,#app .seances button,#app .wt button,#app .chrbtn,#app input,#app select,
#app .p1,#app .bx,#app .mini{border-radius:2px;}
#app .lab,#app .nav button,#app .bo,#app .seances button,#app .chrbtn,#app .pad button,#app .acts button,
#app .add,#app .cta,#app .gh,#app .m .h,#app .f .nn,#app .p1,#app .sli b,#app .calhd b,#app .kpi span{
 text-transform:uppercase;letter-spacing:.09em;}
#app .head .sc{font-weight:700;letter-spacing:-.03em;}
#app .lab{color:var(--a1);opacity:.75;}
#app .h2,#app .calhd b{font-weight:700;letter-spacing:.12em;font-size:12px;}
/* marques d angle sur les cartes d exercice */
#app .exc{position:relative;}
#app .exc::before,#app .exc::after{content:"";position:absolute;width:9px;height:9px;opacity:.55;}
#app .exc::before{left:-1px;top:-1px;border-left:2px solid var(--a1);border-top:2px solid var(--a1);}
#app .exc::after{right:-1px;bottom:-1px;border-right:2px solid var(--a1);border-bottom:2px solid var(--a1);}
/* tuiles de groupe, geometrie inchangee, halo tranchant */
#app .gc{position:relative;}
#app .gc.on{box-shadow:inset 0 0 0 1px currentColor,0 0 22px rgba(0,169,141,.14);}
/* jauges et barres carrees */
#app .tb,#app .tb i,#app .lig .track,#app .lig .track i{border-radius:1px;}
#app .tb{width:14px;}
/* boutons pleins facon lame */
#app .bo.pl2,#app .bo.pl3,#app .seances .plus,#app .cta{border-radius:2px;font-weight:700;}
#app .bo.mo2,#app .bo.mo3,#app .wt button{background:transparent;}
#app .nav{border-top:1px solid rgba(0,169,141,.35);}
#app .nav button{font-size:10.5px;letter-spacing:.12em;padding:6px 0;}
#app .nav button.on{border-bottom-width:2px;}
/* pastille de chrono */
#app .chr{border-radius:2px;padding:9px 10px 9px 14px;}
#app .chr button{border-radius:2px;}
/* calendrier */
#app .cd{border-radius:2px;}
#app .cd.auj{box-shadow:inset 0 -2px 0 var(--a1);}
#app .mois{color:var(--a1);opacity:.8;border-left:1px solid rgba(0,169,141,.35);}
/* separateurs fins */
#app .sli,#app .hist{border-color:var(--line);}

/* ============ ninja, passe 2 ============ */
#app{padding-top:0;}
#app .topbar{display:flex;align-items:center;gap:8px;padding:10px 0 14px;border-bottom:1px solid rgba(0,169,141,.3);margin-bottom:16px;}
#app .topbar .mk{width:10px;height:18px;background:var(--a1);clip-path:polygon(0 0,100% 18%,100% 100%,0 82%);}
#app .topbar .tt2{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--a1);}
#app .topbar .rr{margin-left:auto;font-size:10px;letter-spacing:.2em;color:var(--soft);text-transform:uppercase;}
/* coins coupes facon lame */
#app .card,#app .exc,#app .gc,#app .cd,#app .bo,#app .cta,#app .chrbtn,#app .seances button,#app .add,#app .f{
 clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);}
#app .exc::before,#app .exc::after{display:none;}
#app .exc{border-left:2px solid var(--a1);}
#app .gc.on{border-left:2px solid currentColor;}
#app .head .sc{font-size:46px;}
#app .head{border-bottom:1px solid var(--line);padding-bottom:12px;}
#app .nav{background:rgba(239,241,252,.97);}
#app .nav button{letter-spacing:.22em;}
#app .m .ic{clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);}
#app .p1.encours{border-left:2px solid var(--ink);}
#app .p1.fait{border-left:2px solid var(--a1);}
#app .tb{border:1px solid var(--line);background:#E7E9F8;width:15px;}
#app .sli b{color:var(--a1);}
#app .cd.act{border-left:2px solid var(--a1);}

/* ============ mode arcade ============ */
#app{--neon:#00A7C4;--mag:#E01B6E;position:relative;overflow-x:hidden;}
#app:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;
 background:repeating-linear-gradient(0deg,rgba(0,169,141,.05) 0 1px,transparent 1px 3px),
  radial-gradient(120% 80% at 50% 0%,transparent 45%,rgba(108,59,245,.14) 100%);
 mix-blend-mode:multiply;opacity:.35;animation:scan 8s linear infinite;}
@keyframes scan{0%{background-position:0 0,0 0}100%{background-position:0 120px,0 0}}
#app .topbar{border-bottom:1px solid rgba(0,169,141,.5);box-shadow:0 1px 14px rgba(0,169,141,.18);}
#app .topbar .tt2{color:var(--neon);text-shadow:0 0 10px rgba(0,169,141,.8);font-weight:700;}
#app .topbar .mk{background:var(--neon);box-shadow:0 0 14px var(--neon);}
#app .head .sc{text-shadow:none;}
#app .lab{color:var(--a1);opacity:.85;text-shadow:none;}
#app .card,#app .exc,#app .gc,#app .cd,#app .blc{background:rgba(255,255,255,.9);backdrop-filter:blur(2px);}
#app .exc{border-left:2px solid var(--neon);box-shadow:-6px 0 18px -8px var(--neon);}
#app .gc.on{box-shadow:inset 0 0 0 1px currentColor,0 0 26px rgba(0,169,141,.35);}
#app .tb i,#app .lig .track i{box-shadow:0 0 12px currentColor;filter:saturate(1.3);}
#app .tb{box-shadow:inset 0 0 8px rgba(22,19,43,.18);}
#app .bo.pl2,#app .seances .plus,#app .cta{box-shadow:0 0 16px rgba(0,169,141,.45);text-shadow:0 0 6px rgba(0,0,0,.35);}
#app .bo.pl3{box-shadow:0 0 16px rgba(108,59,245,.45);}
#app .chrbtn{color:var(--neon);border-color:var(--neon);box-shadow:0 0 14px rgba(0,169,141,.28),inset 0 0 12px rgba(0,169,141,.08);}
#app .chr{box-shadow:0 0 26px rgba(0,169,141,.55);}
#app .nav{box-shadow:0 -2px 22px rgba(0,169,141,.16);}
#app .nav button.on{color:var(--neon);text-shadow:0 0 10px rgba(0,169,141,.7);border-bottom-color:var(--neon);}
#app .f.has,#app .m.on .ic,#app .cd.act{box-shadow:0 0 14px rgba(0,169,141,.3),inset 0 0 12px rgba(0,169,141,.12);}
#app .f .ee{filter:drop-shadow(0 0 5px rgba(0,169,141,.35));}
#app .p1.fait{box-shadow:inset 0 0 12px rgba(0,169,141,.18);}
#app .p1.encours{box-shadow:inset 0 0 12px rgba(224,27,110,.14);border-left-color:var(--mag);color:var(--mag);}
#app .wt .w{text-shadow:0 0 12px rgba(0,169,141,.4);}
#app .mois{color:var(--mag);border-left-color:rgba(224,27,110,.45);text-shadow:0 0 8px rgba(224,27,110,.5);}
#app .sli b{color:var(--neon);text-shadow:0 0 8px rgba(0,169,141,.4);}
#app .add{border-color:rgba(0,169,141,.4);color:var(--neon);}
#app .kk{color:var(--soft);}
@media (prefers-reduced-motion:reduce){#app:after{animation:none;}}

/* ============ arcade, cran au dessus ============ */
#app:before{content:"";position:fixed;left:-20%;right:-20%;bottom:-10%;height:55vh;pointer-events:none;z-index:0;
 background:
  repeating-linear-gradient(90deg,rgba(0,169,141,.16) 0 1px,transparent 1px 44px),
  repeating-linear-gradient(0deg,rgba(0,169,141,.16) 0 1px,transparent 1px 34px);
 transform:perspective(320px) rotateX(70deg);transform-origin:bottom;
 mask-image:linear-gradient(0deg,rgba(0,0,0,.9),transparent 70%);
 -webkit-mask-image:linear-gradient(0deg,rgba(0,0,0,.9),transparent 70%);opacity:.5;}
#app>*{position:relative;z-index:1;}
/* enseigne clignotante */
#app .topbar .tt2{}
@keyframes flick{0%,92%,96%,100%{opacity:1}94%{opacity:.35}98%{opacity:.6}}
#app .topbar .rr:after{content:"";display:inline-block;width:7px;height:7px;margin-left:7px;border-radius:50%;
 background:var(--mag);box-shadow:0 0 10px var(--mag);animation:blip 1.6s ease-in-out infinite;}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.15}}
/* equerres de visee sur chaque carte */
#app .card,#app .exc,#app .blc{position:relative;}
#app .card:before,#app .card:after,#app .blc:before,#app .blc:after{content:"";position:absolute;width:11px;height:11px;pointer-events:none;
 border-color:var(--neon);opacity:.8;filter:drop-shadow(0 0 6px rgba(0,169,141,.7));}
#app .card:before,#app .blc:before{right:-1px;top:-1px;border-right:2px solid;border-top:2px solid;}
#app .card:after,#app .blc:after{left:-1px;bottom:-1px;border-left:2px solid;border-bottom:2px solid;}
/* jauges segmentees facon LED */
#app .tb i{background-image:repeating-linear-gradient(0deg,rgba(255,252,245,.45) 0 2px,transparent 2px 7px);}
#app .lig .track i{background-image:repeating-linear-gradient(90deg,rgba(255,252,245,.45) 0 2px,transparent 2px 6px);}
#app .tb{animation:breathe 4s ease-in-out infinite;}
@keyframes breathe{0%,100%{box-shadow:inset 0 0 8px rgba(22,19,43,.18)}50%{box-shadow:inset 0 0 8px rgba(22,19,43,.18),0 0 10px rgba(0,169,141,.18)}}
/* boutons qui s enfoncent */
#app button:active{transform:translateY(1px) scale(.985);}
#app .bo,#app .seances button,#app .chrbtn,#app .cta,#app .wt button{transition:transform .06s,box-shadow .15s;}
#app .seances .plus{animation:pulseg 2.6s ease-in-out infinite;}
@keyframes pulseg{0%,100%{box-shadow:0 0 16px rgba(0,169,141,.45)}50%{box-shadow:0 0 26px rgba(0,169,141,.85)}}
/* score facon borne */
#app .head .sc{font-size:56px;letter-spacing:-.04em;}
#app .head .sc s{letter-spacing:.2em;}
/* pastilles repas cerclees de neon */
#app .m .ic{border-color:rgba(0,169,141,.35);}
#app .m.sel .ic{border-color:var(--mag);box-shadow:0 0 18px rgba(224,27,110,.45);}
/* silhouettes qui rayonnent */
#app .gc.on svg{filter:drop-shadow(0 0 10px currentColor);}
#app .gc .nn{letter-spacing:.14em;}
/* calendrier, jour du jour en magenta clignotant */
#app .cd.auj{box-shadow:inset 0 -2px 0 var(--mag),0 0 14px rgba(224,27,110,.35);}
#app .cd.cur{border-color:var(--neon);box-shadow:0 0 16px rgba(0,169,141,.4);}
@media (prefers-reduced-motion:reduce){#app .topbar .tt2,#app .topbar .rr:after,#app .tb,#app .seances .plus{animation:none;}}

/* ============ effets au clic ============ */
#fx{position:fixed;inset:0;pointer-events:none;z-index:95;}
#fx .rp{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid var(--neon,#22E6C8);
 transform:translate(-50%,-50%);animation:rp .5s ease-out forwards;}
@keyframes rp{0%{opacity:.9;width:14px;height:14px}100%{opacity:0;width:130px;height:130px}}
#fx .pt{position:absolute;width:6px;height:6px;border-radius:50%;transform:translate(-50%,-50%);
 animation:pt .6s ease-out forwards;}
@keyframes pt{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
#fx .ft{position:absolute;transform:translate(-50%,-50%);font-family:ui-monospace,monospace;font-size:13px;font-weight:700;
 letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;animation:ft 1s ease-out forwards;}
@keyframes ft{0%{opacity:0;transform:translate(-50%,-30%) scale(.9)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%) scale(1.05)}}
#fx .fl{position:absolute;inset:0;animation:fl .55s ease-out forwards;}
@keyframes fl{0%{opacity:.55}100%{opacity:0}}
#fx .bn{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:ui-monospace,monospace;font-weight:700;
 font-size:26px;letter-spacing:.24em;text-transform:uppercase;animation:bn 1.1s ease-out forwards;}
@keyframes bn{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}

/* ============ grand ecran, Fold deplie ============ */
@media (min-width:700px){
 #app{max-width:980px;padding-left:26px;padding-right:26px;}
 #app .fg{grid-template-columns:repeat(8,1fr);}
 #app .mrow{gap:10px;}
 #app .duo{gap:26px;}
 #app .exc{display:block;}
 #app .cal{gap:8px;}
 #app .nav{max-width:980px;}
}

 align-items:center;justify-content:center;gap:3px;padding:4px;text-align:center;}
#app .bd .bi{font-size:19px;filter:grayscale(1) brightness(.25);}

#app .bd.got .bn2{color:var(--neon);}

#app .bddesc{border:1px solid var(--line);padding:9px 10px;margin-top:10px;font-size:11.5px;min-height:56px;}
#app .bddesc b{display:block;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
#app .xpbar{height:8px;background:#F2E7D5;border:1px solid var(--line);margin:6px 0 12px;}
#app .xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--neon));box-shadow:0 0 12px rgba(0,169,141,.5);}
#app .trophee{border:1px solid var(--neon);color:var(--neon);padding:6px 10px;font-size:11px;letter-spacing:.14em;
 text-transform:uppercase;box-shadow:0 0 14px rgba(0,169,141,.25);}
#app .save2{display:block;width:100%;text-align:center;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
 color:var(--soft);opacity:.5;margin:18px 0 4px;}

#app .qte{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
#app .qte button{border:1px solid var(--neon);color:var(--neon);padding:12px 0;font-size:14px;font-weight:700;background:rgba(0,169,141,.06);}
#app textarea{font-family:ui-monospace,monospace;}

#app .f{padding-top:15px;}
#app .f i{box-shadow:0 0 10px rgba(0,169,141,.6);}
#app .f .mo{background:#FDE6EF;border-color:var(--mag);color:var(--mag);box-shadow:0 0 10px rgba(224,27,110,.5);}


#fx .chp{position:fixed;left:50%;top:auto;bottom:96px;transform:translateX(-50%);border:1px solid;background:rgba(239,241,252,.95);
 padding:8px 14px;font-family:ui-monospace,monospace;font-size:11.5px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase;white-space:nowrap;animation:chp 2.1s ease-out forwards;}
@keyframes chp{0%{opacity:0;transform:translate(-50%,-10px)}12%{opacity:1;transform:translate(-50%,0)}
 80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
#app .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
#app .wd{border:1px solid var(--line);background:#F7F8FE;padding:7px 0 6px;text-align:center;}
#app .wd .d1{font-size:9px;color:var(--soft);letter-spacing:.1em;}
#app .wd .d2{font-size:15px;font-weight:700;line-height:1.2;}
#app .wd .d3{font-size:10px;margin-top:2px;}
#app .wd.auj2{border-color:var(--neon);box-shadow:0 0 12px rgba(0,169,141,.25);}
#app .wd.ok2{background:rgba(0,169,141,.12);}
#app .wd.rat{background:rgba(224,27,110,.1);}
#app .kpi3{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
#app .med{display:flex;align-items:center;gap:6px;}
#app .fam{border:1px solid var(--line);background:#F2E7D5;padding:8px 7px;text-align:center;}
#app .fam .fi{font-size:18px;filter:grayscale(1) brightness(.3);}
#app .fam.t1 .fi,#app .fam.t2 .fi,#app .fam.t3 .fi,#app .fam.t4 .fi{filter:none;}
#app .fam .fn{font-size:8px;letter-spacing:.04em;text-transform:uppercase;color:#B9B8D6;line-height:1.15;margin-top:3px;}
#app .fam.t1{border-color:#B06A3B}#app .fam.t2{border-color:#B8C0CC}
#app .fam.t3{border-color:#E5B93C}#app .fam.t4{border-color:#7FE8F0;box-shadow:0 0 14px rgba(127,232,240,.3)}
#app .fam.t1 .fn{color:#B06A3B}#app .fam.t2 .fn{color:#B8C0CC}#app .fam.t3 .fn{color:#E5B93C}#app .fam.t4 .fn{color:#7FE8F0}
#app .fam .fp{font-size:8.5px;color:var(--soft);margin-top:2px;}
#app .fam.neg.t1,#app .fam.neg.t2,#app .fam.neg.t3,#app .fam.neg.t4{border-color:var(--mag);}
#app .fam.neg.t1 .fn,#app .fam.neg.t2 .fn,#app .fam.neg.t3 .fn,#app .fam.neg.t4 .fn{color:var(--mag);}
#app .runq{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px;}
#app .runq button{border:1px solid var(--neon);color:var(--neon);background:rgba(0,169,141,.06);padding:13px 0;
 font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}

#app s{text-decoration:none;}
#app .wd{padding:6px 0 5px;}
#app .wd .d2{font-size:15px;line-height:1.25;filter:grayscale(.6);opacity:.55;}
#app .wd.ok2 .d2{filter:none;opacity:1;}
#app .wd .d3{font-size:11px;font-weight:700;line-height:1;min-height:12px;}
#app .plan2{border:1px solid var(--line);border-left:3px solid var(--neon);background:var(--card);
 padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
#app .plan2 .pi{font-size:20px;}
#app .plan2 .pt{flex:1;font-size:13px;font-weight:700;}
#app .plan2 .pt span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);font-weight:400;margin-top:2px;}
#app .plan2 button{border:1px solid var(--neon);color:var(--neon);background:rgba(0,169,141,.08);padding:10px 12px;
 font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
#app .plan2.done{border-left-color:var(--a1);}
#app .plan2.done .fait{color:var(--a1);border-color:var(--a1);background:rgba(0,169,141,.14);}

#app .chk{display:flex;flex-direction:column;gap:5px;}
#app .ck{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);padding:10px 11px;width:100%;text-align:left;}
#app .ck .cb{width:22px;height:22px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
 font-size:12px;font-weight:700;color:var(--a1);flex:0 0 auto;}
#app .ck.on{border-color:var(--a1);background:rgba(0,169,141,.07);}
#app .ck.on .cb{background:var(--a1);border-color:var(--a1);color:#FFFFFF;}
#app .ck.on .cn{color:var(--a1);}
#app .ck .cn{flex:1;font-size:13px;font-weight:600;}
#app .ck .cn i{font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-left:8px;font-weight:400;}
#app .ck.add2{border-style:dashed;color:var(--soft);}
#app .flou{filter:blur(7px);opacity:.75;}

/* ============ arcade clair ============ */
#app:before{background:
  repeating-linear-gradient(90deg,rgba(108,59,245,.22) 0 1px,transparent 1px 44px),
  repeating-linear-gradient(0deg,rgba(108,59,245,.22) 0 1px,transparent 1px 34px);opacity:.45;}
#app:after{background:repeating-linear-gradient(0deg,rgba(22,19,43,.035) 0 1px,transparent 1px 3px),
  radial-gradient(120% 80% at 50% 0%,transparent 55%,rgba(108,59,245,.10) 100%);mix-blend-mode:multiply;opacity:.8;}
#app .topbar{border-bottom:2px solid var(--a3);box-shadow:0 2px 0 rgba(108,59,245,.18);}
#app .topbar .tt2{color:var(--a3);}
#app .topbar .mk{background:var(--a3);box-shadow:2px 2px 0 rgba(224,27,110,.55);}
#app .topbar .rr{color:var(--mag);}
/* boutons facon touche de borne */
#app .bo,#app .seances button,#app .chrbtn,#app .cta,#app .runq button,#app .qte button,#app .nav button{
 box-shadow:2px 2px 0 rgba(22,19,43,.16);}
#app .bo.pl2{background:var(--a1);border-color:var(--a1);box-shadow:2px 2px 0 rgba(0,169,141,.35);}
#app .bo.pl3{background:var(--a3);border-color:var(--a3);box-shadow:2px 2px 0 rgba(108,59,245,.35);}
#app .seances .plus{box-shadow:2px 2px 0 rgba(0,169,141,.4);}
#app .cta{background:var(--a3);border-color:var(--a3);box-shadow:3px 3px 0 rgba(224,27,110,.35);}
#app button:active{transform:translate(1px,1px);}
/* cartes et equerres */
#app .card,#app .exc,#app .blc{box-shadow:3px 3px 0 rgba(108,59,245,.10);}
#app .card:before,#app .blc:before,#app .card:after,#app .blc:after{border-color:var(--a3);opacity:1;filter:none;}
#app .exc{border-left:3px solid var(--a3);}
#app .gc.on{box-shadow:inset 0 0 0 2px currentColor,3px 3px 0 rgba(108,59,245,.18);}
/* jauges type barre de vie */
#app .tb{background:#E7E9F8;border:1px solid var(--line);}
#app .tb i{box-shadow:none;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 2px,transparent 2px 7px);}
#app .lig .track,#app .track{background:#E7E9F8;}
#app .lig .track i{box-shadow:none;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 2px,transparent 2px 6px);}

#app .ck{box-shadow:2px 2px 0 rgba(108,59,245,.08);}

/* navigation facon selecteur de niveau */

#fx .chp{background:#FFFFFF;box-shadow:3px 3px 0 rgba(22,19,43,.15);}

#app .plan2{box-shadow:3px 3px 0 rgba(108,59,245,.12);border-left-color:var(--a3);}
#app .head .sc{text-shadow:2px 2px 0 rgba(224,27,110,.18);}

#app .ckl{display:flex;gap:4px;}
#app .ckl .ck{flex:1;}
#app .ckb{border:1px solid var(--line);background:var(--card);width:36px;font-size:12px;font-weight:700;}
#app .ck.offr{opacity:.45;}

#app .jr{border:1px solid var(--line);background:var(--card);padding:10px 0;font-size:12px;font-weight:700;}
#app .jr.on{background:var(--a1);border-color:var(--a1);color:#fff;}

/* ============ proposition : affiche sportive ============ */
#app{--pap:#FAF7F1;--card:#FFFFFF;--ink:#101820;--soft:#6F7783;--line:#D8D3C9;
 --a1:#0F7A4A;--a2:#E23B23;--a3:#1F4FD8;--a4:#F2B705;--neon:#0F7A4A;--mag:#E23B23;
 font-family:"Helvetica Neue",Inter,ui-sans-serif,system-ui,Arial,sans-serif;
 background-color:#FAF7F1;background-image:none;}
html,body{background:#FAF7F1;}
#app:before,#app:after{display:none;}
#app .card,#app .exc,#app .blc,#app .wd,#app .ck,#app .bo,#app .cta,#app .chrbtn,#app .seances button,
#app .nav button,#app .fam,#app .cd,#app .gc,#app .f,#app .m .ic,#app .plan2,#fx .chp,#app .runq button,
#app .qte button,#app .jr,#app .ckb,#app .add,#app input,#app select,#app textarea{
 box-shadow:none;border-radius:3px;clip-path:none;}
#app .card,#app .exc,#app .blc,#app .plan2{border:1px solid var(--line);}
#app .exc{border-left:4px solid var(--ink);}
#app .card:before,#app .card:after,#app .blc:before,#app .blc:after{display:none;}
#app .topbar{border-bottom:3px solid var(--ink);box-shadow:none;padding:12px 0 10px;}
#app .topbar .tt2{color:var(--ink);font-weight:800;letter-spacing:.34em;}
#app .topbar .mk{background:var(--a2);clip-path:none;width:14px;height:14px;border-radius:50%;}
#app .topbar .rr{color:var(--soft);}
#app .lab{color:var(--soft);font-weight:700;letter-spacing:.16em;opacity:1;}
#app .head{border-bottom:3px solid var(--ink);}

function note(k){k=k||cle();const j=J(k);
 const parts=[];
 const prevus=actesDu(k);
 prevus.forEach(id=>parts.push(faitAct(k,id)?1:0));
 S.actes.forEach(a=>{if(prevus.indexOf(a.id)<0&&faitAct(k,a.id))parts.push(1);});

 if(l.length)parts.push(l.filter(r=>j.rp[S.rappels.indexOf(r)]).length/l.length);

 return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100);}

  s+='<rect x="'+(i*bw+2)+'" y="'+(H-hh)+'" width="'+(bw-4)+'" height="'+Math.max(hh,2)+'" rx="2" fill="'+(v==null?'#262C38':(v>=80?'#2FBE92':v>=55?'#B08A1F':'#C4622D'))+'"/>';});

function ligne(p){if(p.length<2)return '<div class="ln">Un seul relevé</div>';
 const W=300,H=64,xs=p.map(e=>new Date(e.d).getTime()),ys=p.map(e=>e.kg);
 const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);
 const mg=Math.max(1,(y1-y0)*.2);y0-=mg;y1+=mg;
 const px=t=>(x1===x0?0:(t-x0)/(x1-x0))*(W-4)+2,py=v=>4+(1-(v-y0)/(y1-y0))*(H-10);
 const pts=p.map((e,i)=>px(xs[i])+','+py(e.kg));
 return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="margin-top:8px">'
  +'<polyline points="'+pts.join(' ')+'" fill="none" stroke="#2E6FE4" stroke-width="1.6" stroke-linejoin="round"/>'
  +'<circle cx="'+px(xs[p.length-1])+'" cy="'+py(ys[p.length-1])+'" r="3" fill="'+PAL().acc+'"/></svg>';}

 for(let i=0;i<180;i++){const d=new Date(Date.now()-108e5-i*864e5);

  if(!actif){if(i===0)continue;break;}

 return n;}

  if(d.getDate()===1||i===59)cells+='<div class="mois">'+M1[d.getMonth()]+'<br><span>'+String(d.getFullYear()).slice(2)+'</span></div>';

 return '<div class="hist"><div class="calhd"><b id="calmois">'+MOIS[dj.getMonth()]+' '+dj.getFullYear()+'</b>'

function setPal(id,T){const x=S.exos.find(e=>e.id===id);if(!x)return;
 const pos=Math.max(0,TRACK.indexOf(x.r)),actuel=pos*NEED+x.v;
 if(T<0)T=0;
 const rAv=x.r,wAv=x.w;
 if(T>actuel){
  S.seances.push({d:cle(),id:x.id,g:x.g,n:x.n,w:x.w,s:x.s,r:x.r,t:Math.round(x.w*x.s*x.r)});
  if(S.seances.length>500)S.seances=S.seances.slice(-500);
  x.last=cle();S.xp+=10;S.stats.series++;
  const hh=new Date().getHours();if(hh<7&&hh>=4)S.stats.aube=1;if(hh>=0&&hh<4)S.stats.minuit=1;
  burst(LX,LY,'#2FBE92',9);texte(LX,LY,'+1 serie','#2FBE92');vibre(12);}
 else if(T<actuel){S.stats.recul++;
  for(let i=S.seances.length-1;i>=0;i--){if(S.seances[i].id===x.id){S.seances.splice(i,1);break;}}}
 if(T>=TRACK.length*NEED){x.w=Math.round((x.w+x.pas)*100)/100;x.r=TRACK[0];x.v=0;S.xp+=30;
  S.stats.montees++;S.stats.paliers++;chip('+'+x.pas+' kg · '+x.n,'#FF3D8B');burst(LX,LY,'#FF3D8B',12);vibre([15,30,30]);}
 else{x.r=TRACK[Math.floor(T/NEED)];x.v=T%NEED;
  if(T>actuel&&x.r!==rAv){S.stats.paliers++;chip('palier '+x.s+' x '+x.r,'#22E6C8');burst(LX,LY,'#22E6C8',10);vibre([12,25,12]);}}
 save();render();}

function jette(el,ms){FX.appendChild(el);setTimeout(()=>el.remove(),ms);}
function ripple(x,y,c){const d=document.createElement('div');d.className='rp';d.style.left=x+'px';d.style.top=y+'px';
 d.style.borderColor=c||'#22E6C8';jette(d,520);}
function burst(x,y,c,n){for(let i=0;i<(n||10);i++){const a=Math.random()*6.28,r=26+Math.random()*44;
 const d=document.createElement('div');d.className='pt';d.style.left=x+'px';d.style.top=y+'px';d.style.background=c;
 d.style.boxShadow='0 0 8px '+c;d.style.setProperty('--dx',(Math.cos(a)*r-6)+'px');
 d.style.setProperty('--dy',(Math.sin(a)*r-6)+'px');jette(d,640);}}
function texte(x,y,t,c){const d=document.createElement('div');d.className='ft';d.style.left=x+'px';d.style.top=y+'px';
 d.textContent=t;d.style.color=c;d.style.textShadow='0 0 12px '+c;jette(d,1000);}
function flash(c){const d=document.createElement('div');d.className='fl';
 d.style.background='radial-gradient(60% 50% at 50% 45%,'+c+'33,transparent 70%)';jette(d,560);}
function chip(t,c){FX.querySelectorAll('.chp').forEach(x=>x.remove());
 const d=document.createElement('div');d.className='chp';d.textContent=t;
 d.style.borderColor=c;d.style.color=c;d.style.boxShadow='0 0 14px '+c+'55';jette(d,2100);}
function banniere(t,c){const d=document.createElement('div');d.className='bn';d.textContent=t;d.style.color=c;
 d.style.textShadow='0 0 22px '+c;jette(d,1100);}
let chrT=null,chrFin=0,chrDur=60;
function lanceRepos(sec){chrFin=Date.now()+(sec||S.repos)*1000;majChrono();
 clearInterval(chrT);chrT=setInterval(majChrono,250);}
function majChrono(){const r=Math.max(0,Math.round((chrFin-Date.now())/1000));
 const fini=r<=0;

  +'<span class="tt">'+(fini?'repos fini':Math.floor(r/60)+':'+pad(r%60))+'</span>'
  +'<button data-chr="plus">+30</button><button data-chr="reset">↻</button><button data-chr="stop">✕</button></div>';
 if(fini&&chrT){clearInterval(chrT);chrT=null;flash('#E0604C');banniere('go','#E0604C');vibre([60,60,120]);setTimeout(()=>{if(!chrT)CHRONO.innerHTML='';},8000);}}

   +'<button class="gh" data-act="objquot">Eau, sommeil et étirements</button>'
   +'<button class="gh" data-act="objmuscu">Séances de musculation</button>'
   +'<button class="gh" data-act="objcourse">Kilomètres et sorties</button>'
   +'<div class="lab" style="margin:16px 0 8px">Mon programme</div>'
   +'<button class="gh" data-act="habitudes">Ma semaine et mes activités</button>'
   +'<button class="gh" data-act="pratique">Ma pratique et mes groupes</button>'
   +'<div class="lab" style="margin:16px 0 8px">Apparence</div>'
   +'<button class="gh" data-act="themes">Couleurs</button>'
   +'<div class="lab" style="margin:16px 0 8px">Mes données</div>'
   +'<button class="gh" data-act="histpoids">Poids de référence et relevés</button>'
   +'<button class="gh" data-act="sauvegarde">Sauvegarde et restauration</button>'
   +'<button class="gh" style="color:#D1344B" data-act="raz">Repartir de zéro</button>','');break;
  case 'raz':bx('Repartir de zéro',
   '<div class="ln">Efface les séances, les sorties, les journées, les badges et les objectifs. Les exercices sont conservés.</div>',
   '<button class="cta" data-act="razOk">Tout effacer</button><button class="gh" data-act="fermer">Annuler</button>');break;
  case 'razOk':{S.seances=[];S.courses=[];S.jours={};S.badges={};S.tiers={};S.valid={};S.planEx={};
   S.stats={series:0,paliers:0,montees:0,chrono:0,hors:0,newAl:0,newEx:0,supEx:0,recul:0,baisse:0,al:{},jours:{}};
   S.xp=0;S.poids=[{d:cle(),kg:S.ref}];flushNow();fermer();render();break;}
  case 'objquot':bx('mes objectifs',
   '<div class="g2">'+IN('q_eau','Eau en ml par jour',S.eau,'number')+IN('q_dodo','Sommeil en h par nuit',S.dodo,'number')
   +IN('q_etir','Étirements par semaine',S.objEtir,'number')+'</div>'
   +'<div class="ln" style="margin-top:6px">Mets zéro en étirements pour masquer la ligne.</div>',
   '<button class="cta" data-act="objquotOk">Enregistrer</button><button class="gh" data-act="fermer">Annuler</button>');break;
  case 'objquotOk':S.eau=gn('q_eau')||2500;S.dodo=gn('q_dodo')||8;S.objEtir=Math.max(0,gn('q_etir'));
   save();fermer();render();break;
  case 'objmuscu':bx('Objectif de musculation',
   IN('o_mus2','Séances par semaine',S.objMuscu||'','number')
   +'<div class="ln" style="margin-top:6px">Laisse vide pour ne fixer aucun objectif.</div>',
   '<button class="cta" data-act="objmuscuOk">Enregistrer</button><button class="gh" data-act="fermer">Annuler</button>');break;
  case 'objmuscuOk':S.objMuscu=Math.max(0,gn('o_mus2'));save();fermer();render();break;
  case 'objcourse':bx('Objectifs de course',
   '<div class="g2">'+IN('o_km2','Kilomètres par semaine',S.objKm||'','number')+IN('o_st','Sorties par semaine',S.objSorties||'','number')+'</div>'
   +'<div class="ln" style="margin-top:6px">Laisse vide pour ne fixer aucun objectif.</div>',
   '<button class="cta" data-act="objcourseOk">Enregistrer</button><button class="gh" data-act="fermer">Annuler</button>');break;
  case 'objcourseOk':S.objKm=Math.max(0,gn('o_km2'));S.objSorties=Math.max(0,gn('o_st'));save();fermer();render();break;
  case 'fermer':fermer();break;
  case 'badges':bx('Salle des trophées',vueBadges(),'<button class="gh" data-act="fermer">Fermer</button>');break;
  case 'sauvegarde':bx('sauvegarde',
   '<div class="lab" style="margin-bottom:8px">copie de securite</div>'
   +'<textarea id="sv_txt" style="width:100%;height:110px;font-size:10px;background:#F2E7D5;color:var(--ink);border:1px solid var(--line);padding:8px">'+esc(JSON.stringify(S))+'</textarea>'
   +'<div class="lab" style="margin:10px 0 6px">restaurer en collant un fichier ici puis valider</div>',
   '<button class="cta" data-act="restaure">restaurer</button><button class="gh" data-act="fermer">Fermer</button>');break;
  case 'restaure':{try{const o=JSON.parse(document.getElementById('sv_txt').value);
    if(o&&o.exos&&o.jours){S=o;flushNow();fermer();render();banniere('restaure','#22E6C8');}}catch(e){}break;}
  case 'poids':bx('mon poids',IN('p_kg','kilos','','number')
   +'<div class="ln">dernier '+S.poids[S.poids.length-1].kg+' kg le '+courte(S.poids[S.poids.length-1].d)+'</div>',
   '<button class="cta" data-act="poidsOk">Enregistrer</button><button class="gh" data-act="fermer">Annuler</button>');break;
  case 'poidsOk':{const k=gn('p_kg');if(k>0){const t=cle(),e2=S.poids.find(p=>p.d===t);
   if(e2)e2.kg=k;else S.poids.push({d:t,kg:k});S.poids.sort((a,b2)=>a.d<b2.d?-1:1);save();}fermer();render();break;}
  case 'newexo':bxExo(null);break;
  case 'exoOk':{const id=d.id,nom=gv('x_n');if(!nom){fermer();break;}
   if(id){const x=S.exos.find(z=>z.id===id);x.n=nom;x.g=gv('x_g');x.w=gn('x_w');x.s=gn('x_s')||4;x.r=gn('x_r')||8;x.pas=gn('x_pas')||2.5;}
   else{const x=X(gv('x_g'),nom,gn('x_w'),gn('x_s'),gn('x_r'));x.pas=gn('x_pas')||2.5;
    while(S.exos.some(z=>z.id===x.id))x.id+='-2';S.exos.push(x);S.groupe=x.g;S.stats.newEx++;}
   save();fermer();render();break;}
  case 'supOk':S.exos=S.exos.filter(z=>z.id!==d.id);S.stats.supEx++;det=null;save();fermer();render();break;}});

let dr=null;
function setY(el,y,t){const r=el.getBoundingClientRect();let pc=1-(y-r.top)/r.height;pc=Math.max(0,Math.min(1,pc));
 const j=J();if(t==='eau')j.eau=Math.round(pc*S.eau/250)*250;else j.dodo=Math.round(pc*11*2)/2;save();render();}
APP.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-dr]');if(!t)return;dr=t.dataset.dr;setY(t,e.clientY,dr);e.preventDefault();});
let lpT=null,lpOk=false,lpX=0,lpY=0;
function lpStop(){clearTimeout(lpT);lpT=null;}
APP.addEventListener('pointerdown',e=>{const f=e.target.closest('[data-food]');if(!f)return;
 lpOk=false;lpX=e.clientX;lpY=e.clientY;lpStop();
 const k=parseInt(f.dataset.food,10);
 lpT=setTimeout(()=>{lpT=null;lpOk=true;vibre(25);bxQte(k);},450);},true);
APP.addEventListener('pointermove',e=>{if(!lpT)return;
 if(Math.abs(e.clientX-lpX)>12||Math.abs(e.clientY-lpY)>12)lpStop();},true);
APP.addEventListener('pointerup',lpStop,true);
APP.addEventListener('pointercancel',()=>{lpStop();lpOk=false;},true);
window.addEventListener('pointermove',e=>{if(!dr)return;const l=document.querySelector('[data-dr="'+dr+'"]');if(l)setY(l,e.clientY,dr);});
window.addEventListener('pointerup',()=>dr=null);
setInterval(()=>{const k=cle();if(jc&&k!==jc){jc=k;det=null;render();}jc=k;},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S){const k=cle();if(k!==jc){jc=k;det=null;}render();}});
load().then(()=>{jc=cle();J();render();});
})();
</script>
